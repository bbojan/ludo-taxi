<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="t">
  <title id="t">Лудо Такси</title>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#2a2622"/>
      <rect width="8" height="8" fill="#fffbea"/>
      <rect x="8" y="8" width="8" height="8" fill="#fffbea"/>
    </pattern>
  </defs>

  <!-- crazy route: a dashed loop-de-loop from the car to the map pin -->
  <path d="M120 188 C 60 196, 30 150, 70 128 C 110 106, 120 170, 80 172
           M392 150 C 430 150, 440 120, 452 98"
        fill="none" stroke="#c8372d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- map pin -->
  <g transform="translate(462 40) rotate(12)">
    <path d="M0 0 C -22 0 -34 18 -28 36 C -22 52 -6 62 0 78 C 6 62 22 52 28 36 C 34 18 22 0 0 0 Z"
          fill="#c8372d" stroke="#2a2622" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="0" cy="28" r="10" fill="#fffbea" stroke="#2a2622" stroke-width="3"/>
  </g>

  <!-- speed lines -->
  <g stroke="#2a2622" stroke-width="5" stroke-linecap="round">
    <line x1="118" y1="88" x2="150" y2="86"/>
    <line x1="100" y1="112" x2="146" y2="110"/>
    <line x1="116" y1="136" x2="148" y2="134"/>
  </g>

  <!-- the taxi, leaning back as if it just floored it -->
  <g transform="translate(150 34) rotate(-7 130 100)">
    <!-- roof sign -->
    <rect x="102" y="10" width="72" height="26" rx="8" fill="#2a2622"/>
    <text x="138" y="29" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
          font-weight="900" font-size="16" fill="#f6c02e" letter-spacing="2">TAXI</text>
    <!-- body -->
    <path d="M14 112 Q10 82 44 76 L72 72 Q92 40 132 38 L172 38 Q204 40 220 72 L246 78 Q270 84 270 110
             L270 124 Q270 134 260 134 L22 134 Q12 134 12 124 Z"
          fill="#f6c02e" stroke="#2a2622" stroke-width="5" stroke-linejoin="round"/>
    <!-- windows -->
    <path d="M86 72 Q98 50 128 49 L130 72 Z" fill="#bfe3f2" stroke="#2a2622" stroke-width="4" stroke-linejoin="round"/>
    <path d="M141 49 L170 49 Q194 51 208 72 L141 72 Z" fill="#bfe3f2" stroke="#2a2622" stroke-width="4" stroke-linejoin="round"/>
    <!-- window shine -->
    <path d="M100 66 L112 54" stroke="#fffbea" stroke-width="4" stroke-linecap="round"/>
    <!-- checker stripe -->
    <rect x="22" y="94" width="240" height="16" fill="url(#checker)" stroke="#2a2622" stroke-width="3"/>
    <!-- door line and handle -->
    <path d="M136 74 L136 132" stroke="#2a2622" stroke-width="3"/>
    <rect x="146" y="80" width="18" height="5" rx="2.5" fill="#2a2622"/>
    <!-- headlight (winking) and tail light -->
    <path d="M252 88 Q260 82 266 90" fill="none" stroke="#2a2622" stroke-width="4" stroke-linecap="round"/>
    <rect x="14" y="86" width="10" height="12" rx="3" fill="#c8372d" stroke="#2a2622" stroke-width="3"/>
    <!-- smile on the bumper -->
    <path d="M238 118 Q252 128 264 116" fill="none" stroke="#2a2622" stroke-width="4" stroke-linecap="round"/>
    <!-- wheels -->
    <g stroke="#2a2622" stroke-width="5">
      <circle cx="70" cy="134" r="24" fill="#2a2622"/>
      <circle cx="216" cy="134" r="24" fill="#2a2622"/>
      <circle cx="70" cy="134" r="10" fill="#fffbea" stroke-width="3"/>
      <circle cx="216" cy="134" r="10" fill="#fffbea" stroke-width="3"/>
    </g>
    <!-- little exhaust puffs -->
    <g fill="#fffbea" stroke="#2a2622" stroke-width="3">
      <circle cx="-4" cy="124" r="9"/>
      <circle cx="-20" cy="114" r="6"/>
    </g>
  </g>

  <!-- name, letters bouncing a little -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="66" text-anchor="middle">
    <text x="263" y="279" fill="#2a2622" rotate="-6 5 -3 6 0 -5 4 -3 5 -4">Лудо Такси</text>
    <text x="260" y="275" fill="#f6c02e" stroke="#2a2622" stroke-width="3" paint-order="stroke"
          rotate="-6 5 -3 6 0 -5 4 -3 5 -4">Лудо Такси</text>
  </g>
</svg>
