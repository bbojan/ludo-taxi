<!doctype html>
<meta charset="utf-8">
<title>Sheet grid</title>
<!-- Helper for aligning sheets: shows a sheet with a labelled grid in percent of width/height.
     tools/grid.html?id=08              whole sheet
     tools/grid.html?id=08&r=20,60,10,50  crop to x 20–60 %, y 10–50 % (finer grid)            -->
<style>
  html, body { margin: 0; background: #222; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const id = q.get('id') || '01';
const [x0, x1, y0, y1] = (q.get('r') || '0,100,0,100').split(',').map(Number);
const img = new Image();
img.onload = draw;
img.src = `../sheets/${id}.jpg`;
addEventListener('resize', draw);
function draw() {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  const sx = img.naturalWidth * x0 / 100, sy = img.naturalHeight * y0 / 100;
  const sw = img.naturalWidth * (x1 - x0) / 100, sh = img.naturalHeight * (y1 - y0) / 100;
  const k = Math.min((W - 40) / sw, (H - 30) / sh), dw = sw * k, dh = sh * k, ox = 34, oy = 22;
  ctx.drawImage(img, sx, sy, sw, sh, ox, oy, dw, dh);
  const span = Math.max(x1 - x0, y1 - y0);
  const step = span > 60 ? 5 : span > 25 ? 2 : 1;
  ctx.font = 'bold 15px system-ui'; ctx.textBaseline = 'middle';
  const X = v => ox + (v - x0) / (x1 - x0) * dw, Y = v => oy + (v - y0) / (y1 - y0) * dh;
  // screen (CSS px) -> sheet percent, for reading points off a screenshot
  window.toUV = (px, py) => [+(x0 + (px - ox) / dw * (x1 - x0)).toFixed(1), +(y0 + (py - oy) / dh * (y1 - y0)).toFixed(1)];
  window.frame = { W, H, ox, oy, dw, dh };
  for (let v = Math.ceil(x0 / step) * step; v <= x1; v += step) {
    const major = v % (step * 2) === 0;
    ctx.strokeStyle = major ? 'rgba(0,160,255,.75)' : 'rgba(0,160,255,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(v), oy); ctx.lineTo(X(v), oy + dh); ctx.stroke();
    if (major) { ctx.fillStyle = '#7fd3ff'; ctx.textAlign = 'center'; ctx.fillText(v, X(v), 10); }
  }
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) {
    const major = v % (step * 2) === 0;
    ctx.strokeStyle = major ? 'rgba(255,60,200,.75)' : 'rgba(255,60,200,.35)';
    ctx.beginPath(); ctx.moveTo(ox, Y(v)); ctx.lineTo(ox + dw, Y(v)); ctx.stroke();
    if (major) { ctx.fillStyle = '#ff9be6'; ctx.textAlign = 'right'; ctx.fillText(v, ox - 4, Y(v)); }
  }
}
</script>
