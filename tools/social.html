<!doctype html>
<!-- Share image for Twitter / X and LinkedIn (1200 × 630). Rendered to social.png with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --allow-file-access-from-files --window-size=1200,630 --screenshot=social.png tools/social.html -->
<html lang="mk">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f6f1e6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #2a2622;
  }
  /* faint street-grid texture */
  body::before {
    content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(28deg, transparent 0 46px, rgba(42,38,34,.05) 46px 48px),
      repeating-linear-gradient(-62deg, transparent 0 70px, rgba(42,38,34,.05) 70px 72px);
  }
  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 560px;
    display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 500px; height: auto; display: block; margin: 0 0 28px -12px; }
  .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .tag { font-size: 18px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: #fff;
    box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 0 0 1px rgba(42,38,34,.12); }
  .tag.y { background: #f7c600; box-shadow: 0 0 0 2px #2a2622; }
  .url { font: 700 24px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #c8372d; }
  .sheets { position: absolute; right: 40px; top: -30px; width: 520px; height: 690px; }
  .sheet { position: absolute; background: #fffdf6; padding: 10px; border-radius: 4px;
    box-shadow: 0 18px 40px rgba(40,25,10,.28), 0 2px 6px rgba(40,25,10,.18); }
  .sheet img { display: block; width: 100%; height: auto; }
  .back { width: 330px; left: 0; top: 150px; transform: rotate(-9deg); opacity: .85; }
  .front { width: 400px; right: 0; top: 52px; transform: rotate(4deg); }
  .pin { position: absolute; right: 168px; top: 280px; width: 46px; height: 46px; border-radius: 50% 50% 50% 0;
    background: #c8372d; transform: rotate(-45deg); box-shadow: 0 6px 12px rgba(0,0,0,.3); border: 4px solid #fff; }
  .pin::after { content: ''; position: absolute; inset: 12px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
  <div class="left">
    <img class="logo" src="../logo.svg" alt="Лудо Такси">
    <div class="tags">
      <span class="tag y">26 мапи</span>
      <span class="tag">🚕 Каде, шефе?</span>
      <span class="tag">🎯 Погоди ја населбата</span>
    </div>
    <div class="url">bbojan.github.io/ludo-taxi</div>
  </div>
  <div class="sheets">
    <div class="sheet back"><img src="../sheets/09-s.jpg" alt=""></div>
    <div class="sheet front"><img src="../sheets/23.jpg" alt=""></div>
    <div class="pin"></div>
  </div>
</body>
</html>
